; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:genericSTM32F103C8]
platform = ststm32
board = genericSTM32F103C8
framework = arduino
build_src_filter = +<genericSTM32F103C8/>

; Тест платы Blue Pill миганием светодиода (код в src/bluepill_blink/)
[env:bluepill_blink]
platform = ststm32
board = bluepill_f103c8
framework = arduino
build_src_filter = +<bluepill_blink/>
upload_protocol = stlink
monitor_speed = 115200

; Тот же тест, но прошивка по USB через HID Bootloader и Serial через USB CDC
; (см. doc/bluepill_blink/README.md, раздел «Прошивка по USB через HID Bootloader»)
[env:bluepill_blink_hid]
extends = env:bluepill_blink
upload_protocol = hid
build_flags =
    -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
